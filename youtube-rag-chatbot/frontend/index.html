<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube RAG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">

            <div class="header-spacer"></div>

            <div class="brand">
                <div class="logo">
                    <span class="logo-icon">&#9654;</span>
                    <span>YouTube <strong>RAG</strong></span>
                </div>

                <p class="tagline">Paste a link. Ask anything about the video.</p>
            </div>

            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
                <span class="theme-toggle-track">
                    <span class="theme-toggle-thumb">
                        <svg class="icon icon-moon" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/>
                        </svg>
                        <svg class="icon icon-sun" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
                            <path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </span>
                </span>
            </button>

        </header>


        <!-- URL Input -->
        <section class="url-section">

            <div class="url-box">

                <span class="url-marker" aria-hidden="true"></span>

                <input
                    type="text"
                    id="youtubeUrl"
                    placeholder="Paste YouTube link…"
                >

                <button id="loadBtn">
                    Load video
                </button>

            </div>

        </section>


        <!-- Main Content -->
        <main class="main-content is-hidden" id="mainContent">

            <!-- Video Section -->
            <section class="video-section">

                <div class="section-header">
                    <h2>Video</h2>
                    <span class="rec-dot" id="recDot" aria-hidden="true"></span>
                </div>

                <div class="video-container" id="videoContainer">

                    <div class="video-placeholder">

                        <div class="play-icon">&#9654;</div>

                        <h3>Your video will appear here</h3>

                        <p>
                            Paste a YouTube link above to get started
                        </p>

                    </div>

                </div>

            </section>


            <!-- Chat Section -->
            <section class="chat-section">

                <div class="chat-header">

                    <div class="bot-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 3 3 12l9 9 9-9-9-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <div>
                        <h2>Video assistant</h2>

                        <p>
                            Ask questions about this video
                        </p>
                    </div>

                </div>


                <!-- Chat Messages -->
                <div class="chat-messages" id="chatMessages">

                    <div class="welcome-message" id="welcomeMessage">

                        <div class="welcome-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M12 2.5c.6 2.7 1.7 4.3 3.4 4.9-1.7.6-2.8 2.2-3.4 4.9-.6-2.7-1.7-4.3-3.4-4.9 1.7-.6 2.8-2.2 3.4-4.9ZM19 13c.3 1.4.9 2.2 1.9 2.6-1 .4-1.6 1.2-1.9 2.6-.3-1.4-.9-2.2-1.9-2.6 1-.4 1.6-1.2 1.9-2.6Z" fill="currentColor"/>
                            </svg>
                        </div>

                        <h3>Ask about the video</h3>

                        <p>
                            Once a video is loaded, I'll answer using its transcript.
                        </p>

                        <div class="suggestion-chips" id="suggestionChips">
                            <button type="button" class="chip">Summarize this video</button>
                            <button type="button" class="chip">What's the main point?</button>
                            <button type="button" class="chip">List the topics covered</button>
                        </div>

                    </div>

                </div>


                <!-- Chat Input -->
                <div class="chat-input-container">

                    <input
                        type="text"
                        id="questionInput"
                        placeholder="Ask a question about this video…"
                    >

                    <button id="sendBtn" aria-label="Send question">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
